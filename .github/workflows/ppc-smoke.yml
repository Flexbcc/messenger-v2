name: PPC smoke

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run full E2E (Docker + headless storage-app; needs Flutter)
        type: boolean
        default: false
  push:
    paths:
      - "storage-app/**"
      - "backend/shared/storage/**"
      - "backend/services/home-node/**"
      - "backend/services/media-node/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pynacl "zeroconf>=0.131.0"

      - name: Run unit smoke
        run: ./scripts/ppc_smoke/run_unit.sh

      - name: Run integration smoke (optional)
        run: ./scripts/ppc_smoke/run_integration.sh
        env:
          PPC_PAIR_PAYLOAD: ${{ secrets.PPC_PAIR_PAYLOAD }}
          PPC_PAIR_PAYLOAD_FILE: ${{ secrets.PPC_PAIR_PAYLOAD_FILE }}
          NODE_SIGNING_KEY: ${{ secrets.NODE_SIGNING_KEY }}
          PPC_USER_ID: ${{ secrets.PPC_USER_ID }}
          PPC_LAN_HINT: ${{ secrets.PPC_LAN_HINT }}
          PPC_RELAY_URL: ${{ secrets.PPC_RELAY_URL }}
          PPC_STORAGE_NODE_ID: ${{ secrets.PPC_STORAGE_NODE_ID }}

  docker-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: python -m pip install --upgrade pip httpx

      - name: Run Docker relay smoke
        run: ./scripts/ppc_smoke/run_docker_smoke.sh

  e2e-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python deps
        run: python -m pip install --upgrade pip httpx pynacl

      - name: Run full E2E smoke
        run: ./scripts/ppc_smoke/run_e2e_smoke.sh
