events {
    worker_connections 1024;
}

http {
    # --- общие настройки ---
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 512m;   # для загрузки медиа

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Скрываем версию nginx
    server_tokens off;

    # --- HTTP → HTTPS редирект ---
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- home-node :8001 → https://host:443 ---
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # WebSocket upgrade для home-node
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # WebSocket долгоживущий
        proxy_send_timeout 3600s;

        # /health закрыт снаружи — только внутренняя сеть Docker
        location = /health {
            return 403;
        }

        location / {
            proxy_pass http://home-node:8001;
        }
    }

    # --- media-node :8004 → https://host:8444 ---
    server {
        listen 8444 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Большие файлы
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /health {
            return 403;
        }

        location / {
            proxy_pass http://media-node:8004;
        }
    }

    # --- turn-node :8006 → https://host:8446 (только API, не медиапоток) ---
    server {
        listen 8446 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /health {
            return 403;
        }

        # /turn/credentials требует JWT (защищён в коде), но для надёжности
        # запрещаем любые запросы без Authorization-заголовка на nginx уровне
        location = /turn/credentials {
            if ($http_authorization = "") {
                return 401;
            }
            proxy_pass http://turn-node:8006;
        }

        location / {
            proxy_pass http://turn-node:8006;
        }
    }

    # --- gateway-node :8007 → https://host:8447 ---
    server {
        listen 8447 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /health {
            return 403;
        }

        location / {
            proxy_pass http://gateway-node:8007;
        }
    }

    # WebSocket map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
