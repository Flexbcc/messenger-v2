# Клиентская нода — упрощённая сборка для самостоятельного хостинга.
# Та же кодовая база, что и у ноды проекта, но минимум сервисов и настроек.
# Подключается к УЖЕ существующей сети через внешний DISCOVERY_NODE_URL:
# сама регистрируется и шлёт heartbeat (исходящие attestation).
#
# Обязательно задать в .env:
#   DISCOVERY_NODE_URL   — адрес discovery общей сети (НЕ поднимаем локально)
#   HOME_NODE_PUBLIC_URL — как ноду видно снаружи
#   JWT_SECRET, CLUSTER_ID
services:
  home-node:
    build:
      context: .
      dockerfile: services/home-node/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOME_PORT:-8001}:8001"
    environment:
      HOME_NODE_ID: ${HOME_NODE_ID:-home-client}
      HOME_NODE_PUBLIC_URL: ${HOME_NODE_PUBLIC_URL:-http://localhost:8001}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:?set discovery URL of the network}
      STORAGE_NODE_URL: ${STORAGE_NODE_URL:-http://storage-node:8002}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      NODE_RESOURCE_POLICY: ${NODE_RESOURCE_POLICY:-federated}
      OWNER_RESOURCE_PERCENT: ${OWNER_RESOURCE_PERCENT:-40}
      NODE_PARTICIPATE_RELAY: ${NODE_PARTICIPATE_RELAY:-true}
      NODE_PARTICIPATE_STORAGE: ${NODE_PARTICIPATE_STORAGE:-true}
      NODE_PARTICIPATE_WITNESS: ${NODE_PARTICIPATE_WITNESS:-false}
      NODE_PARTICIPATE_MEDIA_CACHE: ${NODE_PARTICIPATE_MEDIA_CACHE:-false}
      NODE_PARTICIPATE_NAT_ASSIST: ${NODE_PARTICIPATE_NAT_ASSIST:-false}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      FEDERATION_AUDIT_DB_PATH: /data/federation_audit.db
      HOME_DB_PATH: /data/home.db
    volumes:
      - ./data/home:/data

  storage-node:
    build:
      context: .
      dockerfile: services/storage-node/Dockerfile
    restart: unless-stopped
    networks:
      - default
      - project
    expose:
      - "8002"
    environment:
      STORAGE_NODE_ID: ${STORAGE_NODE_ID:-storage-client}
      STORAGE_NODE_PUBLIC_URL: ${STORAGE_NODE_PUBLIC_URL:-http://storage-node:8002}
      DISCOVERY_NODE_URL: http://discovery-node:8003
      CLUSTER_ID: ${CLUSTER_ID:-default}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      STORAGE_DB_PATH: /data/storage.db
    volumes:
      - ./data/storage:/data

  # Опционально: микрохаб-relay. Можно выключить, если нода только для себя.
  relay-node:
    build:
      context: .
      dockerfile: services/relay-node/Dockerfile
    restart: unless-stopped
    networks:
      - default
      - project
    expose:
      - "8005"
    environment:
      RELAY_NODE_ID: ${RELAY_NODE_ID:-relay-client}
      RELAY_NODE_PUBLIC_URL: ${RELAY_NODE_PUBLIC_URL:-http://relay-node:8005}
      DISCOVERY_NODE_URL: http://discovery-node:8003
      CLUSTER_ID: ${CLUSTER_ID:-default}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
    volumes:
      - ./data/relay:/data

networks:
  default:
    name: client-node_default
  project:
    external: true
    name: project_default
