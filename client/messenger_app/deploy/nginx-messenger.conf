# nginx on MAIN (194.67.92.147) — HTTPS + same-origin API (fixes iOS PWA + wss).
#
# 1. Point domain or use IP with self-signed / Let's Encrypt
# 2. Build PWA with matching URLs:
#      HOME_NODE_URL=https://YOUR_HOST/home
#      MEDIA_NODE_URL=https://YOUR_HOST/media
#      DISCOVERY_NODE_URL=https://YOUR_HOST/discovery
# 3. certbot: certbot certonly --nginx -d YOUR_HOST
#
# Worker (161.104.18.45) stays on private ports; nginx proxies to it.

server {
    listen 443 ssl http2;
    server_name 194.67.92.147;

    ssl_certificate     /etc/ssl/messenger/fullchain.pem;
    ssl_certificate_key /etc/ssl/messenger/privkey.pem;

    root /root/messenger-pwa;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    location /home/ {
        proxy_pass http://161.104.18.45:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://161.104.18.45:8004/;
        proxy_set_header Host $host;
    }

    location /discovery/ {
        proxy_pass http://194.67.92.147:8003/;
        proxy_set_header Host $host;
    }

    location /gateway/ {
        proxy_pass http://194.67.92.147:8007/;
        proxy_set_header Host $host;
    }
}

# Optional HTTP → HTTPS redirect
server {
    listen 80;
    server_name 194.67.92.147;
    return 301 https://$host$request_uri;
}
