services:
  discovery-node:
    build: ./services/discovery-node
    restart: unless-stopped
    ports:
      - "${DISCOVERY_PORT:-8003}:8003"
    environment:
      DISCOVERY_DB_PATH: /data/discovery.db
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:-}
      ATTESTATION_MODE: ${ATTESTATION_MODE:-off}
      MTLS_MODE: ${MTLS_MODE:-off}
      ALLOWED_BUILD_HASHES: ${ALLOWED_BUILD_HASHES:-}
      ALLOWED_TLS_CERT_FINGERPRINTS: ${ALLOWED_TLS_CERT_FINGERPRINTS:-}
      RELEASE_SIGNING_PUBLIC_KEYS: ${RELEASE_SIGNING_PUBLIC_KEYS:-}
      RELEASE_SIGNING_SECRET: ${RELEASE_SIGNING_SECRET:-}
    volumes:
      - ./data/discovery:/data

  home-node:
    build:
      context: .
      dockerfile: services/home-node/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOME_PORT:-8001}:8001"
    environment:
      HOME_NODE_ID: ${HOME_NODE_ID:-home-local}
      HOME_NODE_PUBLIC_URL: ${HOME_NODE_PUBLIC_URL:-http://localhost:8001}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:-http://discovery-node:8003}
      STORAGE_NODE_URL: ${STORAGE_NODE_URL:-http://storage-node:8002}
      MEDIA_NODE_URL: ${MEDIA_NODE_URL:-http://media-node:8004}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      NODE_RESOURCE_POLICY: ${NODE_RESOURCE_POLICY:-federated}
      OWNER_RESOURCE_PERCENT: ${OWNER_RESOURCE_PERCENT:-40}
      NODE_PARTICIPATE_RELAY: ${NODE_PARTICIPATE_RELAY:-true}
      NODE_PARTICIPATE_STORAGE: ${NODE_PARTICIPATE_STORAGE:-true}
      NODE_PARTICIPATE_WITNESS: ${NODE_PARTICIPATE_WITNESS:-false}
      NODE_PARTICIPATE_MEDIA_CACHE: ${NODE_PARTICIPATE_MEDIA_CACHE:-false}
      NODE_PARTICIPATE_NAT_ASSIST: ${NODE_PARTICIPATE_NAT_ASSIST:-false}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      INTERNAL_SECURITY_MODE: ${INTERNAL_SECURITY_MODE:-legacy}
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      FEDERATION_AUDIT_DB_PATH: /data/federation_audit.db
      FEDERATION_ENVELOPE_MODE: ${FEDERATION_ENVELOPE_MODE:-legacy}
      HOME_DB_PATH: /data/home.db
      PUSH_PROXY_URL: ${PUSH_PROXY_URL:-http://push-proxy:8008}
      PUSH_PROXY_SECRET: ${PUSH_PROXY_SECRET:-changeme-push-secret}
    volumes:
      - ./data/home:/data

  push-proxy:
    build: ./services/push-proxy
    restart: unless-stopped
    # Internal по умолчанию — expose наружу только если нужен прямой доступ клиентов
    expose:
      - "8008"
    ports:
      - "${PUSH_PROXY_PORT:-8008}:8008"
    environment:
      PUSH_PROXY_SECRET: ${PUSH_PROXY_SECRET:-changeme-push-secret}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.example.messenger}
      APNS_KEY_PATH: /data/apns_key.p8
      APNS_SANDBOX: ${APNS_SANDBOX:-true}
      DATABASE_URL: /data/push_tokens.db
      TOKEN_STALE_DAYS: ${TOKEN_STALE_DAYS:-90}
    volumes:
      - ./data/push:/data

  storage-node:
    build:
      context: .
      dockerfile: services/storage-node/Dockerfile
    restart: unless-stopped
    # Internal data-plane only — not published to host (ADR-0011 A7).
    expose:
      - "8002"
    environment:
      STORAGE_NODE_ID: ${STORAGE_NODE_ID:-storage-local}
      STORAGE_NODE_PUBLIC_URL: ${STORAGE_NODE_PUBLIC_URL:-http://storage-node:8002}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:-http://discovery-node:8003}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      INTERNAL_SECURITY_MODE: ${INTERNAL_SECURITY_MODE:-legacy}
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      FEDERATION_AUDIT_DB_PATH: /data/federation_audit.db
      FEDERATION_ENVELOPE_MODE: ${FEDERATION_ENVELOPE_MODE:-legacy}
      STORAGE_DB_PATH: /data/storage.db
    volumes:
      - ./data/storage:/data

  media-node:
    build:
      context: .
      dockerfile: services/media-node/Dockerfile
    restart: unless-stopped
    ports:
      - "${MEDIA_PORT:-8004}:8004"
    environment:
      MEDIA_NODE_ID: ${MEDIA_NODE_ID:-media-local}
      MEDIA_NODE_PUBLIC_URL: ${MEDIA_NODE_PUBLIC_URL:-http://localhost:8004}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:-http://discovery-node:8003}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      INTERNAL_SECURITY_MODE: ${INTERNAL_SECURITY_MODE:-legacy}
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      MEDIA_ACCESS_SECRET: ${MEDIA_ACCESS_SECRET:-}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      MEDIA_STORAGE_DIR: /data/media_blobs
      STORAGE_CONFIG: /project/config/storage.json
      MEDIA_DB_PATH: /data/media.db
      HOME_DB_BACKUP_PATH: /data/home/home.db
      HOME_NODE_URL: ${HOME_NODE_PUBLIC_URL:-http://home-node:8001}
    volumes:
      - ./data/media:/data/media_blobs
      - ./data/media-meta:/data
      - ./config:/project/config:ro
      - ./data/home:/data/home:ro
      - ./data/backups:/data/backups

  relay-node:
    build:
      context: .
      dockerfile: services/relay-node/Dockerfile
    restart: unless-stopped
    # Internal data-plane only — not published to host (ADR-0011 A7).
    expose:
      - "8005"
    environment:
      RELAY_NODE_ID: ${RELAY_NODE_ID:-relay-local}
      RELAY_NODE_PUBLIC_URL: ${RELAY_NODE_PUBLIC_URL:-http://relay-node:8005}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:-http://discovery-node:8003}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      INTERNAL_SECURITY_MODE: ${INTERNAL_SECURITY_MODE:-legacy}
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      FEDERATION_AUDIT_DB_PATH: /data/federation_audit.db
      FEDERATION_ENVELOPE_MODE: ${FEDERATION_ENVELOPE_MODE:-legacy}
    volumes:
      - ./data/relay:/data

  turn-node:
    build:
      context: .
      dockerfile: services/turn-node/Dockerfile
    restart: unless-stopped
    ports:
      - "${TURN_PORT:-8006}:8006"
    environment:
      TURN_NODE_ID: ${TURN_NODE_ID:-turn-local}
      TURN_NODE_PUBLIC_URL: ${TURN_NODE_PUBLIC_URL:-http://localhost:8006}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:-http://discovery-node:8003}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      INTERNAL_SECURITY_MODE: ${INTERNAL_SECURITY_MODE:-legacy}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-dev-only-insecure-secret-change-me}
      TURN_SERVER_HOST: ${TURN_SERVER_HOST:-localhost}
      TURN_SERVER_PORT: ${TURN_SERVER_PORT:-3478}
    volumes:
      - ./data/turn:/data

  # coturn — реальный TURN/STUN-сервер (RFC 5766 / RFC 8656).
  # Использует тот же TURN_SHARED_SECRET что и turn-node (HMAC-SHA1 REST API).
  # Клиент получает временные credentials от turn-node, а медиа идёт через coturn.
  # Порты: 3478 (TURN/STUN UDP+TCP), 5349 (TLS), 49152-65535 (медиа relay UDP).
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host   # обязательно для корректной работы ICE/STUN (видит реальный внешний IP)
    volumes:
      - ./config/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./data/coturn:/var/lib/coturn
    environment:
      # Передаём секрет через env — turnserver.conf читает его через ${TURN_SHARED_SECRET}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-dev-only-insecure-secret-change-me}
      TURN_REALM: ${TURN_REALM:-messenger.local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}  # установить в публичный IP при деплое
    command: >
      -c /etc/coturn/turnserver.conf
      --use-auth-secret
      --static-auth-secret=${TURN_SHARED_SECRET:-dev-only-insecure-secret-change-me}
      --realm=${TURN_REALM:-messenger.local}
      ${TURN_EXTERNAL_IP:+--external-ip=${TURN_EXTERNAL_IP}}

  # nginx-tls — TLS reverse proxy перед нодами (Деплой TLS, опциональный профиль).
  # Запуск: docker compose --profile tls up -d nginx-tls
  # Генерация сертификатов: bash scripts/generate-mtls-certs.sh
  # TLS-порты: 8101(home) 8102(storage) 8103(discovery) 8104(media) 8105(relay)
  nginx-tls:
    image: nginx:alpine
    profiles: [tls]
    restart: unless-stopped
    ports:
      - "8101:8101"  # home-node TLS
      - "8102:8102"  # storage-node TLS
      - "8103:8103"  # discovery-node TLS
      - "8104:8104"  # media-node TLS
      - "8105:8105"  # relay-node TLS
    volumes:
      - ./config/nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./config/mtls/gateway.crt:/etc/nginx/certs/gateway.crt:ro
      - ./config/mtls/gateway.key:/etc/nginx/certs/gateway.key:ro
      - ./config/mtls/ca.crt:/etc/nginx/certs/ca.crt:ro
    depends_on:
      - home-node
      - storage-node
      - discovery-node
      - media-node
      - relay-node

  gateway-node:
    build:
      context: .
      dockerfile: services/gateway-node/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8007}:8007"
      - "${GATEWAY_TLS_PORT:-8447}:${GATEWAY_TLS_PORT:-8447}"
    environment:
      GATEWAY_NODE_ID: ${GATEWAY_NODE_ID:-gateway-local}
      GATEWAY_NODE_PUBLIC_URL: ${GATEWAY_NODE_PUBLIC_URL:-http://localhost:8007}
      GATEWAY_DISCOVERY_PUBLIC_URL: ${GATEWAY_DISCOVERY_PUBLIC_URL:-http://localhost:8003}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:-http://discovery-node:8003}
      DEFAULT_HOME_NODE_URL: ${HOME_NODE_PUBLIC_URL:-http://localhost:8001}
      DEFAULT_MEDIA_NODE_URL: ${MEDIA_NODE_PUBLIC_URL:-http://localhost:8004}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      GATEWAY_INVITE_SECRET: ${GATEWAY_INVITE_SECRET:-}
      GATEWAY_INVITE_TTL_SECONDS: ${GATEWAY_INVITE_TTL_SECONDS:-300}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      GATEWAY_TLS_ENABLED: ${GATEWAY_TLS_ENABLED:-false}
      GATEWAY_TLS_PORT: ${GATEWAY_TLS_PORT:-8447}
      GATEWAY_TLS_CERT_PATH: ${GATEWAY_TLS_CERT_PATH:-/mtls/gateway.crt}
      GATEWAY_TLS_KEY_PATH: ${GATEWAY_TLS_KEY_PATH:-/mtls/gateway.key}
      GATEWAY_TLS_CLIENT_CA_PATH: ${GATEWAY_TLS_CLIENT_CA_PATH:-/mtls/ca.crt}
      GATEWAY_MTLS_MODE: ${GATEWAY_MTLS_MODE:-off}
      ALLOWED_GATEWAY_CLIENT_FINGERPRINTS: ${ALLOWED_GATEWAY_CLIENT_FINGERPRINTS:-}
    volumes:
      - ./data/gateway:/data
      - ./config/mtls:/mtls:ro

  admin:
    build: ./admin-server
    restart: unless-stopped
    # Production: bind localhost only — use SSH tunnel (see docs/HANDOFF-AUTODEPLOY.md).
    # Dev override: ADMIN_BIND=0.0.0.0 in .env
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-9201}:${ADMIN_PORT:-9201}"
    environment:
      ADMIN_PORT: ${ADMIN_PORT:-9201}
      PROJECT_ROOT: /project
      ADMIN_STATIC: /project/admin
      ENV_FILE: /project/.env
      STORAGE_CONFIG: /project/config/storage.json
      COMPOSE_FILE: /project/docker-compose.yml
      MEDIA_NODE_URL: http://media-node:8004
      HOME_NODE_URL: http://project-home-node-1:8001
      STORAGE_NODE_URL: http://storage-node:8002
      RELAY_NODE_URL: http://relay-node:8005
      DISCOVERY_NODE_URL: http://discovery-node:8003
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET:-}
    volumes:
      - .:/project
      - /var/run/docker.sock:/var/run/docker.sock
