# Example: HTTPS PWA + direct proxy to Home Node (one host, docker-compose on localhost).
# Adjust paths, domain, and upstream ports. Requires TLS cert (Let's Encrypt / mkcert).
#
# Build the client with URLs that match what the browser will call:
#   HOME_NODE_URL=https://messenger.example.com/home \
#   MEDIA_NODE_URL=https://messenger.example.com/media \
#   DISCOVERY_NODE_URL=https://messenger.example.com/discovery \
#   ./scripts/build-web-pwa.sh
#
# Then copy build/web/ to /var/www/messenger-pwa/

server {
    listen 443 ssl http2;
    server_name messenger.example.com;

    ssl_certificate     /etc/ssl/messenger/fullchain.pem;
    ssl_certificate_key /etc/ssl/messenger/privkey.pem;

    root /var/www/messenger-pwa;
    index index.html;

    # PWA shell — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter service worker must not be cached aggressively during updates
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Optional: same-origin API (avoids mixed content ws:// vs https://)
    location /home/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
    }

    location /discovery/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
    }
}
