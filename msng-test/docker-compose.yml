    ports:
      - "${PORT_C2_MEDIA:-8024}:8004"
    environment:
      <<: *media-env-base
      CLUSTER_ID: client-2
      MEDIA_NODE_ID: client-2-media
      MEDIA_NODE_PUBLIC_URL: http://localhost:${PORT_C2_MEDIA:-8024}
      HOME_NODE_URL: http://msng-client-2-home:8001
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      MEDIA_DB_PATH: /data/media.db
      NODE_TOKEN_PATH: /data/node_token
    volumes:
      - ./data/client-2/media:/data/media_blobs
      - ./data/client-2/media-meta:/data
      - ./config/storage.json:/app/config/storage.json:ro
    depends_on:
      - msng-discovery

  ##############################################################################
  # CLIENT NODE 3
  ##############################################################################
  msng-client-3-home:
    <<: *home-node-base
    container_name: msng-client-3-home
    networks:
      - msng-net
    ports:
      - "${PORT_C3_HOME:-8031}:8001"
    environment:
      <<: *home-env-base
      CLUSTER_ID: client-3
      HOME_NODE_ID: client-3
      HOME_NODE_PUBLIC_URL: http://localhost:${PORT_C3_HOME:-8031}
      STORAGE_NODE_URL: http://msng-client-3-storage:8002
      MEDIA_NODE_URL: http://msng-client-3-media:8004
      PUSH_PROXY_URL: http://msng-core-push:8008
      PUSH_PROXY_SECRET: ${PUSH_PROXY_SECRET:-test-push-secret}
      HOME_DB_PATH: /data/home.db
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      FEDERATION_AUDIT_DB_PATH: /data/federation_audit.db
