      CLUSTER_ID: client-2
      STORAGE_NODE_ID: client-2-storage
      STORAGE_NODE_PUBLIC_URL: http://msng-client-2-storage:8002
      STORAGE_DB_PATH: /data/storage.db
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
