    ports:
      - "${PORT_C3_MEDIA:-8034}:8004"
    environment:
      <<: *media-env-base
      CLUSTER_ID: client-3
      MEDIA_NODE_ID: client-3-media
      MEDIA_NODE_PUBLIC_URL: http://localhost:${PORT_C3_MEDIA:-8034}
      HOME_NODE_URL: http://msng-client-3-home:8001
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      MEDIA_DB_PATH: /data/media.db
