      NODE_TOKEN_PATH: /data/node_token
    volumes:
      - ./data/client-1/media:/data/media_blobs
      - ./data/client-1/media-meta:/data
      - ./config/storage.json:/app/config/storage.json:ro
    depends_on:
      - msng-discovery

  ##############################################################################
  # CLIENT NODE 2
  ##############################################################################
  msng-client-2-home:
    <<: *home-node-base
    container_name: msng-client-2-home
    networks:
      - msng-net
