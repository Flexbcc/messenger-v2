      - ./data/client-3/media:/data/media_blobs
      - ./data/client-3/media-meta:/data
      - ./config/storage.json:/app/config/storage.json:ro
    depends_on:
      - msng-discovery

  ##############################################################################
  # STORAGE APP — отдельное приложение хранилища (персональное облако)
  ##############################################################################
  msng-storage-app:
    <<: *storage-node-base
    container_name: msng-storage-app
    networks:
      - msng-net
    ports:
      - "${PORT_STORAGE_APP:-8042}:8002"
    environment:
      <<: *storage-env-base
      CLUSTER_ID: storage-app
      STORAGE_NODE_ID: storage-app
      STORAGE_NODE_PUBLIC_URL: http://localhost:${PORT_STORAGE_APP:-8042}
      STORAGE_DB_PATH: /data/storage.db
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      NODE_TOKEN_PATH: /data/node_token
      # Привязан к core-home как владелец
      HOME_NODE_URL: http://msng-core-home:8001
    volumes:
      - ./data/storage-app:/data
    depends_on:
      - msng-discovery
      - msng-core-home

  ##############################################################################
  # ADMIN — панель управления, локальный доступ
  #
  # Слушает ТОЛЬКО 127.0.0.1 — снаружи машины недоступна.
  # Этого достаточно, пока стек крутится у вас на компьютере.
  #
  # Для удалённого сервера так делать НЕЛЬЗЯ: там вместо этого
  # поднимается msng-operator-gw (профиль remote) и пульт из
  # operator-console/, который предъявляет ему сертификат.
  ##############################################################################
  msng-admin:
    build:
      context: ../project/admin-server
    container_name: msng-admin
    networks:
      - msng-admin-net
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_ADMIN:-9210}:9210"
    environment:
      ADMIN_PORT: "9210"
      ADMIN_VARIANT: project
      PROJECT_ROOT: /project
      ADMIN_STATIC: /project/admin
      ENV_FILE: /project/.env
      STORAGE_CONFIG: /project/config/storage.json
      COMPOSE_FILE: /msng-test/docker-compose.yml
      HOME_NODE_URL: http://msng-core-home:8001
      STORAGE_NODE_URL: http://msng-core-storage:8002
      MEDIA_NODE_URL: http://msng-core-media:8004
      RELAY_NODE_URL: http://msng-core-relay:8005
      DISCOVERY_NODE_URL: http://msng-discovery:8003
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:-test-discovery-secret}
      # Пусто = без пароля. Работает только с localhost, для теста нормально.
      # Задайте ADMIN_PANEL_SECRET в .env, если хотите пароль.
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET:-}
    volumes:
      - ../project:/project
      - ./:/msng-test
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - msng-discovery
      - msng-core-home

  ##############################################################################
  # OPERATOR GATEWAY — mTLS-шлюз для пульта управления
  #
  # Админки на сервере НЕТ. Вместо неё — шлюз, который пускает только
  # того, кто предъявил сертификат оператора, выпущенный CA федерации.
  #
  # Кто стучится без сертификата, получает обрыв на TLS-хендшейке:
  # для сканера порт выглядит мёртвым.
  #
  #   9443 → discovery admin API (реестр федерации)
  #   9444 → монитор home-ноды
  #
  # Сам пульт живёт в operator-console/ на машине оператора.
  ##############################################################################
  msng-operator-gw:
    image: nginx:1.27-alpine
    container_name: msng-operator-gw
    # Не поднимается по умолчанию: локально mTLS не нужен — всё на одной
    # машине. Нужен, когда нода на удалённом сервере:
    #     docker compose -p msng --profile remote up -d msng-operator-gw
    profiles: ["remote"]
    networks:
      # Только admin-net. В сети федерации шлюзу делать нечего:
      # discovery и core-home доступны и отсюда, а клиентские ноды
      # при этом не видят его даже по DNS.
      - msng-admin-net
    restart: unless-stopped
    ports:
      - "${PORT_GW_DISCOVERY:-9443}:9443"
      - "${PORT_GW_HOME:-9444}:9444"
    environment:
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:-test-discovery-secret}
      # Имена контейнеров этого стека — в конфиге они подставляются
      DISCOVERY_UPSTREAM: msng-discovery:8003
      HOME_UPSTREAM: msng-core-home:8001
    volumes:
      - ../project/config/nginx/nginx-operator.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ../project/config/nginx/operators-allowlist.conf:/etc/nginx/operators-allowlist.conf:ro
      - ../project/config/mtls:/etc/nginx/certs:ro
      - ./config/operator-gw-entrypoint.sh:/entrypoint.sh:ro
    # Логика старта — в отдельном файле: YAML схлопывает переносы строк,
    # и многострочный shell с циклом и кавычками ломается.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - msng-discovery
      - msng-core-home

  ##############################################################################
  # WEB CLIENT — Flutter web через nginx
  ##############################################################################
  msng-web:
    image: nginx:alpine
    container_name: msng-web
    networks:
      - msng-net
    restart: unless-stopped
    ports:
      - "${PORT_WEB:-3000}:80"
    volumes:
      - ./web-build:/usr/share/nginx/html:ro
      - ./config/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

##############################################################################
# СЕТИ
#
# msng-net        — федерация. Здесь живут все ноды и общаются между собой.
# msng-admin-net  — административная. Шлюз оператора плюс сервисы, к которым
#                   он проксирует (core + discovery).
#
# Клиентские ноды (client-1/2/3) в msng-admin-net НЕ входят — они не видят
# msng-operator-gw даже по DNS изнутри Docker.
#
# Порты шлюза (9443/9444) проброшены наружу намеренно: управлять нодой нужно
# из дома. Защита здесь не сетевая, а криптографическая — без клиентского
# сертификата соединение рвётся на TLS-хендшейке.
##############################################################################
networks:
  msng-net:
    name: msng-net
    driver: bridge
  msng-admin-net:
    name: msng-admin-net
    driver: bridge
