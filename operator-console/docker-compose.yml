##############################################################################
# operator-console — пульт управления федерацией
#
# Запускается НА МАШИНЕ ОПЕРАТОРА, а не на сервере.
#
# Ходит к нодам через mTLS-шлюз, предъявляя сертификат оператора.
# На серверах админки нет вообще — их админ-порты закрыты, а шлюз
# отвечает только тому, у кого есть сертификат.
#
# Запуск:    ./up.sh
# Остановка: ./down.sh
##############################################################################

services:
  console:
    build:
      context: ../project/admin-server
    container_name: operator-console
    restart: unless-stopped

    ports:
      # Только localhost. Пульт живёт на твоей машине — выставлять
      # его в сеть незачем даже в домашней сети.
      - "127.0.0.1:9300:9300"

    environment:
      ADMIN_PORT: "9300"
      ADMIN_VARIANT: operator

      # ── Секрет панели ───────────────────────────────────────────────────
      # Второй фактор поверх сертификата: если кто-то получит доступ
      # к разблокированному ноутбуку, ему всё ещё нужен секрет.
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET:?Задайте ADMIN_PANEL_SECRET в .env}

      # ── Сертификаты ─────────────────────────────────────────────────────
      OPERATOR_CERT_DIR: /certs
      OPERATOR_CERT_NAME: ${OPERATOR_CERT_NAME:-operator.crt}
      OPERATOR_KEY_NAME: ${OPERATOR_KEY_NAME:-operator.key}

      # ── Адреса mTLS-шлюзов ──────────────────────────────────────────────
      # Порт 9443 — discovery admin API (реестр федерации)
      # Порт 9444 — монитор своей home-ноды
      OPERATOR_DISCOVERY_URL: ${OPERATOR_DISCOVERY_URL:?Укажите адрес шлюза discovery}
      OPERATOR_HOME_URL: ${OPERATOR_HOME_URL:-}

      # ── Свои ноды ───────────────────────────────────────────────────────
      # node_id через запятую. Только для них доступны операции,
      # выходящие за рамки телеметрии и реестра федерации.
      OPERATOR_OWNED_NODES: ${OPERATOR_OWNED_NODES:-}

      # ── SSH-канал: обслуживание своих серверов ──────────────────────────
      # Деплой, перезапуск контейнеров, логи. Требует root-доступа,
      # поэтому работает только на своих машинах.
      #
      # Можно не настраивать: без SSH останутся телеметрия федерации
      # и операции реестра — они идут через mTLS.
      OPERATOR_SSH_KEY: /ssh/id_operator
      OPERATOR_SSH_HOSTS: ${OPERATOR_SSH_HOSTS:-}
      OPERATOR_NODE_INVENTORY: ${OPERATOR_NODE_INVENTORY:-}
      OPERATOR_INSTALL_DIR: ${OPERATOR_INSTALL_DIR:-/opt/messenger/project}

      # Статика панели
      ADMIN_STATIC: /app/admin

    volumes:
      # Сертификаты — только чтение. Приватный ключ не должен
      # покидать эту папку и попадать в git.
      - ./certs:/certs:ro

      # SSH-ключ для обслуживания серверов — только чтение.
      # Отдельный ключ, а не основной ~/.ssh/id_rsa: если контейнер
      # скомпрометирован, отзывается только он.
      - ${OPERATOR_SSH_KEY_PATH:-./certs/.gitkeep}:/ssh/id_operator:ro

      # UI панели
      - ../project/admin:/app/admin:ro

    # Пульт не управляет локальным docker и не читает серверные конфиги —
    # docker.sock сюда намеренно НЕ монтируется.
