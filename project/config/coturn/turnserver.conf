# coturn — конфиг TURN/STUN сервера для мессенджера
# Используется совместно с turn-node (FastAPI), который выдаёт временные credentials.
# Схема аутентификации: TURN REST API (shared secret + HMAC-SHA1).
# Документация: https://github.com/coturn/coturn/wiki/turnserver

# Порты
listening-port=3478
tls-listening-port=5349

# Диапазон UDP-портов для медиарелея (WebRTC)
min-port=49152
max-port=65535

# Аутентификация через shared secret (REST API, совместимо с turn-node)
# Секрет передаётся через --static-auth-secret в docker-compose command
use-auth-secret

# Realm (домен) — должен совпадать с тем, что отдаёт turn-node клиентам
# Переопределяется через TURN_REALM env и --realm в docker-compose command
realm=messenger.local

# Логирование
log-file=stdout
simple-log

# Fingerprint в STUN-пакетах (рекомендуется для WebRTC)
fingerprint

# Запретить plain-text relay (только зашифрованный трафик через TLS/DTLS)
# Раскомментировать в продакшне:
# no-udp-relay
# no-tcp-relay

# Безопасность: запретить loopback и приватные адреса как peer endpoints
no-loopback-peers
no-multicast-peers

# Отключить устаревшие методы аутентификации
no-tlsv1
no-tlsv1_1
stale-nonce=600
no-cli
no-software-attribute

# Prometheus-метрики (опционально)
# prometheus

# Файл для PID
pidfile=/var/run/coturn/turnserver.pid
