# nginx TLS reverse proxy для federation-трафика между нодами (Фаза 3 / Деплой TLS)
#
# Топология:
#   Внешний трафик → nginx (TLS termination) → ноды (plain HTTP внутри Docker сети)
#
# TLS-порты (HTTPS):
#   8101 → home-node:8001
#   8102 → storage-node:8002
#   8103 → discovery-node:8003
#   8104 → media-node:8004
#   8105 → relay-node:8005
#
# Сертификаты генерируются скриптом scripts/generate-mtls-certs.sh
# После генерации: FORCE=1 bash scripts/generate-mtls-certs.sh
# Готовые сертификаты: config/mtls/gateway.crt + gateway.key + ca.crt

events {
    worker_connections 1024;
}

http {
    # Общие настройки TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # Сертификат и ключ (общие для всех виртуальных хостов — wildcard или SAN)
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;

    # mTLS: проверять клиентский сертификат (опционально, включить MTLS_MODE=enforce)
    # ssl_client_certificate /etc/nginx/certs/ca.crt;
    # ssl_verify_client optional;

    # Заголовки безопасности
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Таймауты для WebSocket (home-node WS)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ── home-node (8101 → 8001) ──────────────────────────────────────────────
    server {
        listen 8101 ssl;
        server_name _;

        location / {
            proxy_pass http://home-node:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── storage-node (8102 → 8002) ───────────────────────────────────────────
    server {
        listen 8102 ssl;
        server_name _;

        location / {
            proxy_pass http://storage-node:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── discovery-node (8103 → 8003) ─────────────────────────────────────────
    server {
        listen 8103 ssl;
        server_name _;

        location / {
            proxy_pass http://discovery-node:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── media-node (8104 → 8004) ─────────────────────────────────────────────
    server {
        listen 8104 ssl;
        server_name _;

        location / {
            proxy_pass http://media-node:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ── relay-node (8105 → 8005) ─────────────────────────────────────────────
    server {
        listen 8105 ssl;
        server_name _;

        location / {
            proxy_pass http://relay-node:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
