# HTTPS site: landing + PWA (/app/) + same-origin API proxy (secure context for SW + WebRTC).
# Deploy: scripts/deploy-https-site.sh

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 194.67.92.147;

    ssl_certificate     /etc/ssl/messenger/fullchain.pem;
    ssl_certificate_key /etc/ssl/messenger/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/messenger-site;
    index index.html;
    client_max_body_size 100m;

    # ── PWA ──────────────────────────────────────────────────────────────────
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /app/flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── API proxies (same origin → no mixed content) ─────────────────────────
    location /home/ {
        location = /home/health { return 403; }
        proxy_pass http://161.104.18.45:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /media/ {
        location = /media/health { return 403; }
        proxy_pass http://161.104.18.45:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /discovery/ {
        location = /discovery/health { return 403; }
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /gateway/ {
        proxy_pass http://127.0.0.1:8007/gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /releases/ {
        proxy_pass http://127.0.0.1:8007/releases/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300";
    }

    # /health закрыт публично — только для внутреннего мониторинга
    location = /health {
        return 403;
    }

    # ── Landing static ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }
}

# Redirect legacy HTTP ports → HTTPS
server {
    listen 80;
    listen 7357;
    listen [::]:80;
    server_name 194.67.92.147;
    return 301 https://194.67.92.147$request_uri;
}
