# HTTPS site: landing + PWA (/app/) + same-origin API proxy (secure context for SW + WebRTC).
# Deploy: scripts/deploy-https-site.sh

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.lineage2-stok.online;

    ssl_certificate     /etc/letsencrypt/live/app.lineage2-stok.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lineage2-stok.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_buffer_size     4k;

    root /var/www/messenger-site;
    index index.html;
    client_max_body_size 100m;

    # The VM/NAT path stalls nginx sendfile packets (tiny HTML responses showed
    # ~10s TTFB and the Flutter bundle remained pending). Use regular buffered
    # reads and flush small TLS records immediately for this virtual host.
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;

    # Flutter's compiled JavaScript is several megabytes without compression.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json
               application/wasm text/css text/javascript image/svg+xml;

    # ── PWA ──────────────────────────────────────────────────────────────────
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Entrypoints must always be revalidated. Long-lived caching here can keep
    # a stale Flutter loader after a release and leave the PWA on a blank page.
    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /app/flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /app/flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── API proxies (same origin → no mixed content) ─────────────────────────
    location /home/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /discovery/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /gateway/ {
        proxy_pass http://127.0.0.1:8007/gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /releases/ {
        proxy_pass http://127.0.0.1:8007/releases/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300";
    }

    # Gateway health is used by the client's connection diagnostics.
    location = /health {
        proxy_pass http://127.0.0.1:8007/health;
        proxy_set_header Host $host;
    }

    # ── Landing static ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }
}

# Redirect legacy HTTP ports → HTTPS
server {
    listen 80;
    listen 7357;
    listen [::]:80;
    server_name app.lineage2-stok.online;
    location /.well-known/acme-challenge/ {
        root /var/www/messenger-site;
    }
    return 301 https://app.lineage2-stok.online$request_uri;
}
