name: ouo-node-lab

x-node: &node
  restart: unless-stopped
  networks: [ouo-internal]
  command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port $${PORT} --ssl-keyfile /data/tls.key --ssl-certfile /data/tls.crt"]
  cpus: 1.0
  mem_limit: 768m
  pids_limit: 256
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import ssl,urllib.request; c=ssl.create_default_context(cafile='/data/ca.crt'); c.check_hostname=False; urllib.request.urlopen('https://127.0.0.1:'+'$${PORT}'+'/health',context=c,timeout=2)\""]
    interval: 20s
    timeout: 3s
    retries: 3
    start_period: 20s
  environment: &node-env
    CLUSTER_ID: pve2-node-lab
    ENROLLMENT_MODE: strict
    INTERNAL_SECURITY_MODE: signed
    FEDERATION_NODE_ID_MODE: enforce
    FEDERATION_CAPABILITY_MODE: enforce
    FEDERATION_ENVELOPE_MODE: signed
    DISCOVERY_NODE_URL: https://discovery-d1:8003
    FEDERATION_DISCOVERY_URLS: https://discovery-d1:8003,https://discovery-d2:8003,https://discovery-d3:8003
    NODE_REGISTRATION_DISCOVERY_URLS: https://discovery-d1:8003,https://discovery-d2:8003,https://discovery-d3:8003
    FEDERATION_MINIMUM_DISCOVERY_SOURCES: "2"
    NODE_CHALLENGE_OBSERVER_ENABLED: "true"
    NODE_CHALLENGE_ALLOW_HTTP: "false"
    NODE_ROOT_KEY_PATH: /data/node_root_key
    NODE_SIGNING_KEY_PATH: /data/node_signing_key
    NODE_OPERATIONAL_CERTIFICATE_PATH: /data/node_operational_certificate.json
    NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/operational_credential_chain.json
    NODE_TRANSPORT_KEY_PATH: /data/node_transport_key
    NODE_TRANSPORT_CERTIFICATE_PATH: /data/node_transport_certificate.json
    NODE_CAPABILITY_CERTIFICATE_PATH: /data/capability-certificate.json
    NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/authority-state.json
    DISCOVERY_SIGNING_PUBLIC_KEYS: ${DISCOVERY_SIGNING_PUBLIC_KEYS:?required}
    NODE_BUILD_HASH: ${NODE_BUILD_HASH:-main-local}
    NODE_SOFTWARE_VERSION: lab-0.2.0
    RELEASE_SIGNING_PUBLIC_KEYS: ${RELEASE_SIGNING_PUBLIC_KEYS:-provisioning-placeholder}
    ALLOWED_BUILD_HASHES: ${ALLOWED_BUILD_HASHES:-provisioning-placeholder}
    ALLOWED_TLS_CERT_FINGERPRINTS: ${ALLOWED_TLS_CERT_FINGERPRINTS:-provisioning-placeholder}
    ATTESTATION_MODE: enforce
    MTLS_MODE: enforce
    SSL_CERT_FILE: /data/ca.crt
    OUO_TLS_CA_FILE: /data/ca.crt
    MESH_NOTIFY_SECRET: ${MESH_NOTIFY_SECRET:?required}
    OWNER_PANEL_SECRET: ${OWNER_PANEL_SECRET:?required}

x-discovery: &discovery
  <<: *node
  build: {context: ../.., dockerfile: services/discovery-node/Dockerfile}
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import ssl,urllib.request; c=ssl.create_default_context(cafile='/data/ca.crt'); c.check_hostname=False; urllib.request.urlopen('https://127.0.0.1:8003/health',context=c,timeout=2)\""]
  environment: &discovery-env
    <<: *node-env
    PORT: "8003"
    DISCOVERY_DB_PATH: /data/discovery.db
    ENROLLMENT_MODE: strict
    INTERNAL_SECURITY_MODE: signed
    NODE_IDENTITY_MODE: enforce
    OPERATIONAL_CREDENTIAL_STATE_MODE: enforce
    OPERATIONAL_CREDENTIAL_REVOCATION_MODE: enforce
    NODE_ADVERTISEMENT_MODE: enforce
    CAPABILITY_CERTIFICATE_MODE: enforce
    TRANSPORT_CERTIFICATE_MODE: enforce
    TRUST_LEDGER_MODE: enforce
    TRUST_DEGRADATION_MODE: observe
    TRUST_PROPOSAL_MODE: report
    RANDOMNESS_CHECKPOINT_MODE: enforce
    CHALLENGE_PROPOSAL_SCHEDULER_MODE: enforce
    TRUST_AUTHORITY_STATE_PATH: /data/authority-state.json
    CAPABILITY_AUTHORITY_STATE_PATH: /data/authority-state.json
    DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:?required}
    AUTHORITY_GOSSIP_ENABLED: "true"
    NODE_ADVERTISEMENT_GOSSIP_ENABLED: "true"
    TRUST_RECORD_GOSSIP_ENABLED: "true"
    CHALLENGE_ASSIGNMENT_GOSSIP_ENABLED: "true"

x-home: &home
  <<: *node
  build: {context: ../.., dockerfile: services/home-node/Dockerfile}
  mem_limit: 1024m
  environment: &home-env
    <<: *node-env
    PORT: "8001"
    HOME_DB_PATH: /data/home.db
    ROUTE_RESOLUTION_MODE: enforce
    ROUTE_DISCOVERY_URLS: https://discovery-d1:8003,https://discovery-d2:8003,https://discovery-d3:8003
    ROUTE_MINIMUM_DISCOVERY_SOURCES: "2"
    PEER_DISCOVERY_URLS: https://discovery-d1:8003,https://discovery-d2:8003,https://discovery-d3:8003
    PEER_MINIMUM_DISCOVERY_SOURCES: "2"
    PEER_AUTHORITY_STATE_PATH: /data/authority-state.json
    PEER_DISCOVERY_SOURCE_SET_PATH: /data/peer-discovery-source-set.json
    RELAY_TRANSPORT_MODE: websocket-preferred
    STORAGE_NODE_URLS: https://storage-a:8002,https://storage-b:8002
    STORAGE_REPLICATION_FACTOR: "2"
    STORAGE_WRITE_QUORUM: "1"
    JWT_SECRET: ${JWT_SECRET:?required}
    PUSH_PROXY_URL: ""
    MEDIA_NODE_URL: ""

x-storage: &storage
  <<: *node
  build: {context: ../.., dockerfile: services/storage-node/Dockerfile}
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import ssl,urllib.request; c=ssl.create_default_context(cafile='/data/ca.crt'); c.check_hostname=False; urllib.request.urlopen('https://127.0.0.1:8002/health',context=c,timeout=2)\""]
  environment: &storage-env
    <<: *node-env
    PORT: "8002"
    STORAGE_DB_PATH: /data/storage.db
    STORAGE_MAX_OPAQUE_BYTES: "1073741824"
    STORAGE_MAX_PADDED_POLL_BYTES: "1048576"

x-relay: &relay
  <<: *node
  build: {context: ../.., dockerfile: services/relay-node/Dockerfile}
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import ssl,urllib.request; c=ssl.create_default_context(cafile='/data/ca.crt'); c.check_hostname=False; urllib.request.urlopen('https://127.0.0.1:8005/health',context=c,timeout=2)\""]
  environment: &relay-env
    <<: *node-env
    PORT: "8005"
    RELAY_TARGET_VALIDATION_MODE: enforce
    MIX_DISCOVERY_URLS: https://discovery-d1:8003,https://discovery-d2:8003,https://discovery-d3:8003
    MIX_MINIMUM_DISCOVERY_SOURCES: "2"
    MIX_POOL_MAX_CELLS: "1024"
    MIX_POOL_MAX_BYTES: "67108864"

services:
  provisioner:
    profiles: [tools]
    build: {context: ../.., dockerfile: services/discovery-node/Dockerfile}
    entrypoint: ["python", "/app/provision-node-lab.py"]
    command: ["--runtime-root", "/nodes", "--output-root", "/operator"]
    restart: "no"
    networks: []
    volumes:
      - ../../scripts/provision-node-lab.py:/app/provision-node-lab.py:ro
      - ./runtime/operator:/operator
      - discovery-d1:/nodes/discovery-d1
      - discovery-d2:/nodes/discovery-d2
      - discovery-d3:/nodes/discovery-d3
      - home-a:/nodes/home-a
      - home-b:/nodes/home-b
      - home-c:/nodes/home-c
      - home-d:/nodes/home-d
      - home-e:/nodes/home-e
      - storage-a:/nodes/storage-a
      - storage-b:/nodes/storage-b
      - relay-a:/nodes/relay-a
      - relay-b:/nodes/relay-b
      - gateway:/nodes/gateway
      - turn-api:/nodes/turn-api

  approver:
    profiles: [tools]
    build: {context: ../.., dockerfile: services/discovery-node/Dockerfile}
    entrypoint: ["python", "/app/approve-node-lab.py"]
    command:
      - --ca-file
      - /operator/tls-ca.crt
      - --origin
      - https://discovery-d1:8003
      - --origin
      - https://discovery-d2:8003
      - --origin
      - https://discovery-d3:8003
    environment:
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:?required}
    networks: [ouo-internal]
    volumes:
      - ../../scripts/approve-node-lab.py:/app/approve-node-lab.py:ro
      - ./runtime/operator:/operator:ro

  discovery-bootstrap:
    profiles: [tools]
    build: {context: ../.., dockerfile: services/discovery-node/Dockerfile}
    entrypoint: ["python", "/app/bootstrap-discovery-lab.py"]
    command:
      - --manifest
      - /operator/provisioned.json
      - --ca-file
      - /operator/tls-ca.crt
      - --origin
      - https://discovery-d1:8003
      - --origin
      - https://discovery-d2:8003
      - --origin
      - https://discovery-d3:8003
    networks: [ouo-internal]
    volumes:
      - ../../scripts/bootstrap-discovery-lab.py:/app/bootstrap-discovery-lab.py:ro
      - ./runtime/operator:/operator:ro

  verifier:
    profiles: [tools]
    build: {context: ../.., dockerfile: services/home-node/Dockerfile}
    entrypoint: ["python", "/app/verify-node-lab.py"]
    command:
      - --ca-file
      - /operator/tls-ca.crt
      - --output
      - /operator/lab-verification.json
      - --users-per-home
      - "5"
      - --messages
      - "100"
    networks: [ouo-internal]
    volumes:
      - ../../scripts/verify-node-lab.py:/app/verify-node-lab.py:ro
      - ./runtime/operator:/operator

  restart-verifier:
    profiles: [tools]
    build: {context: ../.., dockerfile: services/home-node/Dockerfile}
    entrypoint: ["python", "/app/verify-node-lab-restart.py"]
    command:
      - --ca-file
      - /operator/tls-ca.crt
      - --report
      - /operator/lab-verification.json
    networks: [ouo-internal]
    volumes:
      - ../../scripts/verify-node-lab-restart.py:/app/verify-node-lab-restart.py:ro
      - ../../scripts/verify_node_lab_crypto.py:/app/verify_node_lab_crypto.py:ro
      - ./runtime/operator:/operator:ro

  discovery-d1:
    <<: *discovery
    ports: ["127.0.0.1:18031:8003"]
    environment:
      <<: *discovery-env
      DISCOVERY_NODE_ID: discovery-d1
      DISCOVERY_NODE_PUBLIC_URL: https://discovery-d1:8003
      NODE_RELEASE_SIGNATURE: ${DISCOVERY_D1_RELEASE_SIGNATURE:-provisioning-placeholder}
      NODE_TLS_CERT_FINGERPRINT: ${DISCOVERY_D1_TLS_FINGERPRINT:-provisioning-placeholder}
      AUTHORITY_GOSSIP_PEERS: https://discovery-d2:8003,https://discovery-d3:8003
      NODE_ADVERTISEMENT_GOSSIP_PEERS: https://discovery-d2:8003,https://discovery-d3:8003
      TRUST_RECORD_GOSSIP_PEERS: https://discovery-d2:8003,https://discovery-d3:8003
      CHALLENGE_ASSIGNMENT_GOSSIP_PEERS: https://discovery-d2:8003,https://discovery-d3:8003
    volumes: [discovery-d1:/data]
  discovery-d2:
    <<: *discovery
    ports: ["127.0.0.1:18032:8003"]
    environment:
      <<: *discovery-env
      DISCOVERY_NODE_ID: discovery-d2
      DISCOVERY_NODE_PUBLIC_URL: https://discovery-d2:8003
      NODE_RELEASE_SIGNATURE: ${DISCOVERY_D2_RELEASE_SIGNATURE:-provisioning-placeholder}
      NODE_TLS_CERT_FINGERPRINT: ${DISCOVERY_D2_TLS_FINGERPRINT:-provisioning-placeholder}
      AUTHORITY_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d3:8003
      NODE_ADVERTISEMENT_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d3:8003
      TRUST_RECORD_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d3:8003
      CHALLENGE_ASSIGNMENT_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d3:8003
    volumes: [discovery-d2:/data]
  discovery-d3:
    <<: *discovery
    ports: ["127.0.0.1:18033:8003"]
    environment:
      <<: *discovery-env
      DISCOVERY_NODE_ID: discovery-d3
      DISCOVERY_NODE_PUBLIC_URL: https://discovery-d3:8003
      NODE_RELEASE_SIGNATURE: ${DISCOVERY_D3_RELEASE_SIGNATURE:-provisioning-placeholder}
      NODE_TLS_CERT_FINGERPRINT: ${DISCOVERY_D3_TLS_FINGERPRINT:-provisioning-placeholder}
      AUTHORITY_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d2:8003
      NODE_ADVERTISEMENT_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d2:8003
      TRUST_RECORD_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d2:8003
      CHALLENGE_ASSIGNMENT_GOSSIP_PEERS: https://discovery-d1:8003,https://discovery-d2:8003
    volumes: [discovery-d3:/data]

  home-a:
    <<: *home
    ports: ["127.0.0.1:18101:8001"]
    environment: {<<: *home-env, HOME_NODE_ID: home-a, HOME_NODE_PUBLIC_URL: "https://home-a:8001", NODE_RELEASE_SIGNATURE: "${HOME_A_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${HOME_A_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [home-a:/data]
  home-b:
    <<: *home
    ports: ["127.0.0.1:18102:8001"]
    environment: {<<: *home-env, HOME_NODE_ID: home-b, HOME_NODE_PUBLIC_URL: "https://home-b:8001", NODE_RELEASE_SIGNATURE: "${HOME_B_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${HOME_B_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [home-b:/data]
  home-c:
    <<: *home
    ports: ["127.0.0.1:18103:8001"]
    environment: {<<: *home-env, HOME_NODE_ID: home-c, HOME_NODE_PUBLIC_URL: "https://home-c:8001", NODE_RELEASE_SIGNATURE: "${HOME_C_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${HOME_C_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [home-c:/data]
  home-d:
    <<: *home
    ports: ["127.0.0.1:18104:8001"]
    environment: {<<: *home-env, HOME_NODE_ID: home-d, HOME_NODE_PUBLIC_URL: "https://home-d:8001", NODE_RELEASE_SIGNATURE: "${HOME_D_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${HOME_D_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [home-d:/data]
  home-e:
    <<: *home
    ports: ["127.0.0.1:18105:8001"]
    environment: {<<: *home-env, HOME_NODE_ID: home-e, HOME_NODE_PUBLIC_URL: "https://home-e:8001", NODE_RELEASE_SIGNATURE: "${HOME_E_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${HOME_E_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [home-e:/data]

  storage-a:
    <<: *storage
    environment: {<<: *storage-env, STORAGE_NODE_ID: storage-a, STORAGE_NODE_PUBLIC_URL: "https://storage-a:8002", NODE_RELEASE_SIGNATURE: "${STORAGE_A_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${STORAGE_A_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [storage-a:/data]
  storage-b:
    <<: *storage
    environment: {<<: *storage-env, STORAGE_NODE_ID: storage-b, STORAGE_NODE_PUBLIC_URL: "https://storage-b:8002", NODE_RELEASE_SIGNATURE: "${STORAGE_B_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${STORAGE_B_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [storage-b:/data]

  relay-a:
    <<: *relay
    environment: {<<: *relay-env, RELAY_NODE_ID: relay-a, RELAY_NODE_PUBLIC_URL: "https://relay-a:8005", NODE_RELEASE_SIGNATURE: "${RELAY_A_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${RELAY_A_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [relay-a:/data]
  relay-b:
    <<: *relay
    environment: {<<: *relay-env, RELAY_NODE_ID: relay-b, RELAY_NODE_PUBLIC_URL: "https://relay-b:8005", NODE_RELEASE_SIGNATURE: "${RELAY_B_RELEASE_SIGNATURE:-provisioning-placeholder}", NODE_TLS_CERT_FINGERPRINT: "${RELAY_B_TLS_FINGERPRINT:-provisioning-placeholder}"}
    volumes: [relay-b:/data]

  gateway:
    <<: *node
    build: {context: ../.., dockerfile: services/gateway-node/Dockerfile}
    mem_limit: 384m
    ports: ["127.0.0.1:18080:8007"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=2)"]
    environment:
      <<: *node-env
      GATEWAY_NODE_ID: gateway-lab
      GATEWAY_NODE_PUBLIC_URL: http://gateway:8007
      GATEWAY_DISCOVERY_PUBLIC_URL: http://discovery-d1:8003
      DEFAULT_HOME_NODE_URL: http://home-a:8001
      GATEWAY_TLS_ENABLED: "false"
      GATEWAY_INVITE_SECRET: ${GATEWAY_INVITE_SECRET:?required}
    volumes: [gateway:/data]

  turn-api:
    <<: *node
    build: {context: ../.., dockerfile: services/turn-node/Dockerfile}
    mem_limit: 384m
    depends_on: [coturn]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=2)"]
    environment:
      <<: *node-env
      TURN_NODE_ID: turn-lab
      TURN_NODE_PUBLIC_URL: http://turn-api:8006
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?required}
      TURN_SERVER_HOST: coturn
      JWT_SECRET: ${JWT_SECRET:?required}
    volumes: [turn-api:/data]

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    networks: [ouo-internal]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?required}
      - --realm=ouo-lab.internal
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers

networks:
  ouo-internal:
    internal: true

volumes:
  discovery-d1: {}
  discovery-d2: {}
  discovery-d3: {}
  home-a: {}
  home-b: {}
  home-c: {}
  home-d: {}
  home-e: {}
  storage-a: {}
  storage-b: {}
  relay-a: {}
  relay-b: {}
  gateway: {}
  turn-api: {}
