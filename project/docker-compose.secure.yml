# Security override for the node stack. Validate .env.secure before use:
#   python3 scripts/validate-secure-env.py .env.secure
#   docker compose --env-file .env.secure \
#     -f docker-compose.yml -f docker-compose.secure.yml config
services:
  discovery-node:
    environment:
      ENROLLMENT_MODE: strict
      NODE_IDENTITY_MODE: enforce
      OPERATIONAL_CREDENTIAL_STATE_MODE: enforce
      OPERATIONAL_CREDENTIAL_REVOCATION_MODE: enforce
      NODE_ADVERTISEMENT_MODE: enforce
      CAPABILITY_CERTIFICATE_MODE: enforce
      TRANSPORT_CERTIFICATE_MODE: enforce
      CAPABILITY_AUTHORITY_STATE_PATH: ${CAPABILITY_AUTHORITY_STATE_PATH:-}
      RENDEZVOUS_GOSSIP_ENABLED: ${RENDEZVOUS_GOSSIP_ENABLED:-false}
      RENDEZVOUS_GOSSIP_PEERS: ${RENDEZVOUS_GOSSIP_PEERS:-}
      RENDEZVOUS_GOSSIP_INTERVAL_SECONDS: ${RENDEZVOUS_GOSSIP_INTERVAL_SECONDS:-30}
      RENDEZVOUS_GOSSIP_TIMEOUT_SECONDS: ${RENDEZVOUS_GOSSIP_TIMEOUT_SECONDS:-5}
      TRUST_LEDGER_MODE: enforce
      TRUST_PROPOSAL_MODE: report
      TRUST_AUTHORITY_STATE_PATH: ${TRUST_AUTHORITY_STATE_PATH:-}
      RANDOMNESS_CHECKPOINT_MODE: enforce
      CHALLENGE_PROPOSAL_SCHEDULER_MODE: enforce
      INTERNAL_SECURITY_MODE: signed
      ATTESTATION_MODE: report
      MTLS_MODE: report
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:?required}
      MESH_NOTIFY_SECRET: ${MESH_NOTIFY_SECRET:?required}

  home-node:
    environment:
      NODE_CHALLENGE_OBSERVER_ENABLED: "true"
      NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS: ${NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS:-30}
      FEDERATION_DISCOVERY_URLS: ${FEDERATION_DISCOVERY_URLS:-}
      FEDERATION_MINIMUM_DISCOVERY_SOURCES: ${FEDERATION_MINIMUM_DISCOVERY_SOURCES:-2}
      ENROLLMENT_MODE: strict
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/operational_credential_chain.json
      INTERNAL_SECURITY_MODE: signed
      FEDERATION_NODE_ID_MODE: enforce
      FEDERATION_CAPABILITY_MODE: enforce
      NODE_CAPABILITY_CERTIFICATE_PATH: /data/capability_certificate.json
      NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/capability_authority_state.json
      RELAY_TRANSPORT_MODE: websocket-preferred
      ROUTE_RESOLUTION_MODE: enforce
      ROUTE_DISCOVERY_URLS: ${ROUTE_DISCOVERY_URLS:-}
      ROUTE_MINIMUM_DISCOVERY_SOURCES: ${ROUTE_MINIMUM_DISCOVERY_SOURCES:-2}
      TRANSPORT_ROUTE_HOPS: ${TRANSPORT_ROUTE_HOPS:-3}
      FEDERATION_ENVELOPE_MODE: signed
      PREKEY_CONSUMPTION_MODE: strict
      JWT_SECRET: ${JWT_SECRET:?required}
      MEDIA_ACCESS_SECRET: ${MEDIA_ACCESS_SECRET:?required}
      PUSH_PROXY_SECRET: ${PUSH_PROXY_SECRET:?required}

  storage-node:
    environment:
      NODE_CHALLENGE_OBSERVER_ENABLED: "true"
      NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS: ${NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS:-30}
      FEDERATION_DISCOVERY_URLS: ${FEDERATION_DISCOVERY_URLS:-}
      FEDERATION_MINIMUM_DISCOVERY_SOURCES: ${FEDERATION_MINIMUM_DISCOVERY_SOURCES:-2}
      ENROLLMENT_MODE: strict
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/operational_credential_chain.json
      INTERNAL_SECURITY_MODE: signed
      FEDERATION_NODE_ID_MODE: enforce
      FEDERATION_CAPABILITY_MODE: enforce
      FEDERATION_ENVELOPE_MODE: signed
      NODE_CAPABILITY_CERTIFICATE_PATH: /data/capability_certificate.json
      NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/capability_authority_state.json
      MESH_NOTIFY_SECRET: ${MESH_NOTIFY_SECRET:?required}

  media-node:
    environment:
      NODE_CHALLENGE_OBSERVER_ENABLED: "true"
      NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS: ${NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS:-30}
      FEDERATION_DISCOVERY_URLS: ${FEDERATION_DISCOVERY_URLS:-}
      FEDERATION_MINIMUM_DISCOVERY_SOURCES: ${FEDERATION_MINIMUM_DISCOVERY_SOURCES:-2}
      ENROLLMENT_MODE: strict
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/operational_credential_chain.json
      INTERNAL_SECURITY_MODE: signed
      FEDERATION_NODE_ID_MODE: enforce
      FEDERATION_CAPABILITY_MODE: enforce
      NODE_CAPABILITY_CERTIFICATE_PATH: /data/capability_certificate.json
      NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/capability_authority_state.json
      JWT_SECRET: ${JWT_SECRET:?required}
      MEDIA_ACCESS_SECRET: ${MEDIA_ACCESS_SECRET:?required}
      MESH_NOTIFY_SECRET: ${MESH_NOTIFY_SECRET:?required}

  relay-node:
    environment:
      NODE_CHALLENGE_OBSERVER_ENABLED: "true"
      NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS: ${NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS:-30}
      FEDERATION_DISCOVERY_URLS: ${FEDERATION_DISCOVERY_URLS:-}
      FEDERATION_MINIMUM_DISCOVERY_SOURCES: ${FEDERATION_MINIMUM_DISCOVERY_SOURCES:-2}
      ENROLLMENT_MODE: strict
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/operational_credential_chain.json
      INTERNAL_SECURITY_MODE: signed
      FEDERATION_NODE_ID_MODE: enforce
      FEDERATION_CAPABILITY_MODE: enforce
      FEDERATION_ENVELOPE_MODE: signed
      NODE_CAPABILITY_CERTIFICATE_PATH: /data/capability_certificate.json
      NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/capability_authority_state.json
      RELAY_TARGET_VALIDATION_MODE: enforce
      MIX_DISCOVERY_URLS: ${MIX_DISCOVERY_URLS:-}
      MIX_MINIMUM_DISCOVERY_SOURCES: ${MIX_MINIMUM_DISCOVERY_SOURCES:-2}
      MIX_PEER_CACHE_TTL_SECONDS: ${MIX_PEER_CACHE_TTL_SECONDS:-60}
      MIX_PEER_CACHE_MAX_RECORDS: ${MIX_PEER_CACHE_MAX_RECORDS:-1000}
      MIX_REPLAY_DB_PATH: /data/mix_replay.db
      MESH_NOTIFY_SECRET: ${MESH_NOTIFY_SECRET:?required}

  turn-node:
    environment:
      NODE_CHALLENGE_OBSERVER_ENABLED: "true"
      NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS: ${NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS:-30}
      FEDERATION_DISCOVERY_URLS: ${FEDERATION_DISCOVERY_URLS:-}
      FEDERATION_MINIMUM_DISCOVERY_SOURCES: ${FEDERATION_MINIMUM_DISCOVERY_SOURCES:-2}
      ENROLLMENT_MODE: strict
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/operational_credential_chain.json
      INTERNAL_SECURITY_MODE: signed
      FEDERATION_NODE_ID_MODE: enforce
      FEDERATION_CAPABILITY_MODE: enforce
      NODE_CAPABILITY_CERTIFICATE_PATH: /data/capability_certificate.json
      NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/capability_authority_state.json
      JWT_SECRET: ${JWT_SECRET:?required}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?required}

  coturn:
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?required}

  gateway-node:
    environment:
      NODE_CHALLENGE_OBSERVER_ENABLED: "true"
      NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS: ${NODE_CHALLENGE_OBSERVER_INTERVAL_SECONDS:-30}
      FEDERATION_DISCOVERY_URLS: ${FEDERATION_DISCOVERY_URLS:-}
      FEDERATION_MINIMUM_DISCOVERY_SOURCES: ${FEDERATION_MINIMUM_DISCOVERY_SOURCES:-2}
      ENROLLMENT_MODE: strict
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/operational_credential_chain.json
      INTERNAL_SECURITY_MODE: signed
      FEDERATION_NODE_ID_MODE: enforce
      FEDERATION_CAPABILITY_MODE: enforce
      FEDERATION_ENVELOPE_MODE: signed
      NODE_CAPABILITY_CERTIFICATE_PATH: /data/capability_certificate.json
      NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/capability_authority_state.json
      GATEWAY_INVITE_SECRET: ${GATEWAY_INVITE_SECRET:?required}
      MESH_NOTIFY_SECRET: ${MESH_NOTIFY_SECRET:?required}
      GATEWAY_TLS_ENABLED: "true"
      GATEWAY_MTLS_MODE: required

  push-proxy:
    environment:
      PUSH_PROXY_SECRET: ${PUSH_PROXY_SECRET:?required}

  admin:
    environment:
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET:?required}
