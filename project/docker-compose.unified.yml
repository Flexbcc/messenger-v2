services:
  ouo-node:
    container_name: ouo-node
    build:
      context: .
      dockerfile: services/unified-node/Dockerfile
    restart: unless-stopped
    # The public starter profile targets a small 1 vCPU / 2 GiB host. Leave
    # enough headroom for the kernel, Docker, nginx and certificate renewal.
    cpus: "${OUO_CPU_LIMIT:-0.80}"
    mem_limit: "${OUO_MEMORY_LIMIT:-1400m}"
    mem_reservation: "${OUO_MEMORY_RESERVATION:-768m}"
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)); assert d.get('status') in ('ok','healthy')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "${HOME_BIND:-127.0.0.1}:${HOME_PORT:-8001}:8001"
      - "${STORAGE_BIND:-127.0.0.1}:${STORAGE_PORT:-8002}:8002"
      - "${DISCOVERY_BIND:-127.0.0.1}:${DISCOVERY_PORT:-8003}:8003"
      - "${MEDIA_BIND:-127.0.0.1}:${MEDIA_PORT:-8004}:8004"
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8005}:8005"
    environment:
      OUO_NODE_ID: ${OUO_NODE_ID:-ouo-local}
      # Every unknown node first enters pending state and needs an explicit
      # operator approval before it can participate in the public network.
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-strict}
      HOME_NODE_ID: ${OUO_NODE_ID:-ouo-local}
      DISCOVERY_NODE_ID: ${OUO_NODE_ID:-ouo-local}
      STORAGE_NODE_ID: ${OUO_NODE_ID:-ouo-local}
      MEDIA_NODE_ID: ${OUO_NODE_ID:-ouo-local}
      RELAY_NODE_ID: ${OUO_NODE_ID:-ouo-local}
      NODE_CAPABILITIES: ${NODE_CAPABILITIES:-home,discovery,storage,media,relay}
      HOME_NODE_PUBLIC_URL: ${HOME_NODE_PUBLIC_URL:-http://127.0.0.1:8001}
      DISCOVERY_NODE_PUBLIC_URL: ${DISCOVERY_NODE_PUBLIC_URL:-http://127.0.0.1:8003}
      STORAGE_NODE_PUBLIC_URL: ${STORAGE_NODE_PUBLIC_URL:-http://127.0.0.1:8002}
      MEDIA_NODE_PUBLIC_URL: ${MEDIA_NODE_PUBLIC_URL:-http://127.0.0.1:8004}
      RELAY_NODE_PUBLIC_URL: ${RELAY_NODE_PUBLIC_URL:-http://127.0.0.1:8005}
      DISCOVERY_NODE_URL: http://127.0.0.1:8003
      ROUTE_DISCOVERY_URLS: http://127.0.0.1:8003
      # A single-node local installation has one local Discovery module.
      # Multi-source quorum belongs to a multi-node deployment profile.
      ROUTE_RESOLUTION_MODE: "off"
      SIGNED_PEER_SELECTION_MODE: "off"
      # Required acknowledgement for the two local-only downgrades above.
      # This is scoped to the unified compose service and does not change the
      # secure defaults used by normal multi-node deployments.
      ALLOW_INSECURE_HOME_MODES: "true"
      ROUTE_MINIMUM_DISCOVERY_SOURCES: "2"
      MIX_MINIMUM_DISCOVERY_SOURCES: "2"
      PEER_MINIMUM_DISCOVERY_SOURCES: "2"
      STORAGE_NODE_URL: http://127.0.0.1:8002
      STORAGE_NODE_URLS: http://127.0.0.1:8002
      MEDIA_NODE_URL: http://127.0.0.1:8004
      HOME_DB_PATH: /data/home/home.db
      DISCOVERY_DB_PATH: /data/discovery/discovery.db
      STORAGE_DB_PATH: /data/storage/storage.db
      MEDIA_DB_PATH: /data/media-meta/media.db
      MEDIA_STORAGE_DIR: /data/media
      TRUST_LEDGER_DB_PATH: /data/discovery/trust-ledger.db
      NETWORK_VIEW_STATE_PATH: /data/discovery/network-view.json
      NODE_ROOT_KEY_PATH: /data/identity/node_root_key
      NODE_SIGNING_KEY_PATH: /data/identity/node_signing_key
      NODE_OPERATIONAL_CERTIFICATE_PATH: /data/identity/node_operational_certificate.json
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/identity/node_operational_credential_chain.json
      NODE_CAPABILITY_CERTIFICATE_PATH: /data/identity/node_capability_certificate.json
      NODE_CAPABILITY_AUTHORITY_STATE_PATH: /data/identity/capability_authority_state.json
      CAPABILITY_AUTHORITY_STATE_PATH: /data/identity/capability_authority_state.json
      NODE_TRANSPORT_KEY_PATH: /data/identity/node_transport_key
      NODE_TRANSPORT_CERTIFICATE_PATH: /data/identity/node_transport_certificate.json
      NODE_TOKEN_PATH: /data/identity/node_token
      ENROLLMENT_SECRET_PATH: /data/identity/enrollment_secret
      FEDERATION_NONCE_DB_PATH: /data/runtime/federation_nonces.db
      FEDERATION_AUDIT_DB_PATH: /data/runtime/federation_audit.db
      MIX_REPLAY_DB_PATH: /data/runtime/mix_replay.db
      RELAY_LINK_SEQUENCE_DB_PATH: /data/runtime/relay_link_sequences.db
      STORAGE_CONFIG: /runtime/config/storage.json
    volumes:
      - ./data/unified:/data
      - ./config:/runtime/config:ro

  admin:
    container_name: ouo-admin
    build:
      context: .
      dockerfile: admin-server/Dockerfile
    restart: unless-stopped
    depends_on:
      ouo-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-9201}:${ADMIN_PORT:-9201}"
    environment:
      ADMIN_PORT: ${ADMIN_PORT:-9201}
      PROJECT_ROOT: /project
      ADMIN_STATIC: /project/admin
      HOME_NODE_URL: http://ouo-node:8001
      STORAGE_NODE_URL: http://ouo-node:8002
      DISCOVERY_NODE_URL: http://ouo-node:8003
      MEDIA_NODE_URL: http://ouo-node:8004
      RELAY_NODE_URL: http://ouo-node:8005
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET:?ADMIN_PANEL_SECRET is required}
      ADMIN_CONSOLE_PATH: ${ADMIN_CONSOLE_PATH:-console}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-https://admin.ouoapp.ru}
      OWNER_PANEL_SECRET: ${OWNER_PANEL_SECRET:-}
      MEDIA_ADMIN_SECRET: ${MEDIA_ADMIN_SECRET:-}
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:-}
      ADMIN_SECURITY_MODE: ${ADMIN_SECURITY_MODE:-strict}
    volumes:
      - ./admin:/project/admin:ro
