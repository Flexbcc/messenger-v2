services:
  discovery-node:
    build:
      context: .
      dockerfile: services/discovery-node/Dockerfile
    restart: unless-stopped
    ports:
      - "${DISCOVERY_BIND:-0.0.0.0}:${DISCOVERY_PORT:-8003}:8003"
    environment:
      DISCOVERY_DB_PATH: /data/discovery.db
      DISCOVERY_NODE_ID: ${DISCOVERY_NODE_ID:-discovery-local}
      DISCOVERY_NODE_PUBLIC_URL: ${DISCOVERY_NODE_PUBLIC_URL:-http://localhost:8003}
      NODE_ROOT_KEY_PATH: /data/discovery_node_root.key
      NODE_SIGNING_KEY_PATH: /data/discovery_node_operational.key
      NODE_OPERATIONAL_CERTIFICATE_PATH: /data/discovery_node_operational_certificate.json
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_IDENTITY_MODE: ${NODE_IDENTITY_MODE:-report}
      OPERATIONAL_CREDENTIAL_STATE_MODE: ${OPERATIONAL_CREDENTIAL_STATE_MODE:-report}
      OPERATIONAL_CREDENTIAL_REVOCATION_MODE: ${OPERATIONAL_CREDENTIAL_REVOCATION_MODE:-report}
      NODE_ADVERTISEMENT_MODE: ${NODE_ADVERTISEMENT_MODE:-report}
      CAPABILITY_CERTIFICATE_MODE: ${CAPABILITY_CERTIFICATE_MODE:-report}
      TRANSPORT_CERTIFICATE_MODE: ${TRANSPORT_CERTIFICATE_MODE:-report}
      CAPABILITY_AUTHORITY_STATE_PATH: ${CAPABILITY_AUTHORITY_STATE_PATH:-}
      TRUST_LEDGER_MODE: ${TRUST_LEDGER_MODE:-report}
      TRUST_DEGRADATION_MODE: ${TRUST_DEGRADATION_MODE:-observe}
      TRUST_AUTHORITY_STATE_PATH: ${TRUST_AUTHORITY_STATE_PATH:-}
      TRUST_LEDGER_DB_PATH: /data/trust-ledger.db
      NETWORK_VIEW_STATE_PATH: /data/network-view.json
      RECOVERY_AUTHORITY_STATE_PATH: ${RECOVERY_AUTHORITY_STATE_PATH:-}
      AUTHORITY_GOSSIP_ENABLED: ${AUTHORITY_GOSSIP_ENABLED:-false}
      AUTHORITY_GOSSIP_PEERS: ${AUTHORITY_GOSSIP_PEERS:-}
      AUTHORITY_GOSSIP_INTERVAL_SECONDS: ${AUTHORITY_GOSSIP_INTERVAL_SECONDS:-30}
      AUTHORITY_GOSSIP_TIMEOUT_SECONDS: ${AUTHORITY_GOSSIP_TIMEOUT_SECONDS:-5}
      NODE_ADVERTISEMENT_GOSSIP_ENABLED: ${NODE_ADVERTISEMENT_GOSSIP_ENABLED:-false}
      NODE_ADVERTISEMENT_GOSSIP_PEERS: ${NODE_ADVERTISEMENT_GOSSIP_PEERS:-}
      NODE_ADVERTISEMENT_GOSSIP_INTERVAL_SECONDS: ${NODE_ADVERTISEMENT_GOSSIP_INTERVAL_SECONDS:-30}
      NODE_ADVERTISEMENT_GOSSIP_TIMEOUT_SECONDS: ${NODE_ADVERTISEMENT_GOSSIP_TIMEOUT_SECONDS:-5}
      TRUST_RECORD_GOSSIP_ENABLED: ${TRUST_RECORD_GOSSIP_ENABLED:-false}
      TRUST_RECORD_GOSSIP_PEERS: ${TRUST_RECORD_GOSSIP_PEERS:-}
      TRUST_RECORD_GOSSIP_INTERVAL_SECONDS: ${TRUST_RECORD_GOSSIP_INTERVAL_SECONDS:-30}
      TRUST_RECORD_GOSSIP_TIMEOUT_SECONDS: ${TRUST_RECORD_GOSSIP_TIMEOUT_SECONDS:-5}
      TRUST_PROPOSAL_MODE: ${TRUST_PROPOSAL_MODE:-off}
      TRUST_PROPOSAL_INTERVAL_SECONDS: ${TRUST_PROPOSAL_INTERVAL_SECONDS:-30}
      CHALLENGE_ASSIGNMENT_GOSSIP_ENABLED: ${CHALLENGE_ASSIGNMENT_GOSSIP_ENABLED:-false}
      CHALLENGE_ASSIGNMENT_GOSSIP_PEERS: ${CHALLENGE_ASSIGNMENT_GOSSIP_PEERS:-}
      CHALLENGE_ASSIGNMENT_GOSSIP_INTERVAL_SECONDS: ${CHALLENGE_ASSIGNMENT_GOSSIP_INTERVAL_SECONDS:-30}
      CHALLENGE_ASSIGNMENT_GOSSIP_TIMEOUT_SECONDS: ${CHALLENGE_ASSIGNMENT_GOSSIP_TIMEOUT_SECONDS:-5}
      CHALLENGE_PROPOSAL_SCHEDULER_MODE: ${CHALLENGE_PROPOSAL_SCHEDULER_MODE:-off}
      CHALLENGE_PROPOSAL_SCHEDULER_INTERVAL_SECONDS: ${CHALLENGE_PROPOSAL_SCHEDULER_INTERVAL_SECONDS:-30}
      RANDOMNESS_CHECKPOINT_MODE: ${RANDOMNESS_CHECKPOINT_MODE:-report}
      DISCOVERY_ADMIN_SECRET: ${DISCOVERY_ADMIN_SECRET:-}
      ATTESTATION_MODE: ${ATTESTATION_MODE:-off}
      MTLS_MODE: ${MTLS_MODE:-off}
      ALLOWED_BUILD_HASHES: ${ALLOWED_BUILD_HASHES:-}
      ALLOWED_TLS_CERT_FINGERPRINTS: ${ALLOWED_TLS_CERT_FINGERPRINTS:-}
      RELEASE_SIGNING_PUBLIC_KEYS: ${RELEASE_SIGNING_PUBLIC_KEYS:-}
      RELEASE_SIGNING_SECRET: ${RELEASE_SIGNING_SECRET:-}
    volumes:
      - ./data/discovery:/data

