      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/node_operational_credential_chain.json
      NODE_CAPABILITY_CERTIFICATE_PATH: ${NODE_CAPABILITY_CERTIFICATE_PATH:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-dev-only-insecure-secret-change-me}
      TURN_SERVER_HOST: ${TURN_SERVER_HOST:-coturn}
      TURN_SERVER_PORT: ${TURN_SERVER_PORT:-3478}
      TURN_SERVER_TLS_PORT: ${TURN_SERVER_TLS_PORT:-5349}
      TURN_REALM: ${TURN_REALM:-messenger.local}
      TURN_ENABLE_UDP: ${TURN_ENABLE_UDP:-true}
      TURN_ENABLE_TCP: ${TURN_ENABLE_TCP:-true}
      TURN_ENABLE_TLS: ${TURN_ENABLE_TLS:-false}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
    volumes:
      - ./data/turn:/data

  # coturn — реальный TURN/STUN-сервер (RFC 5766 / RFC 8656).
  # Использует тот же TURN_SHARED_SECRET что и turn-node (HMAC-SHA1 REST API).
  # Клиент получает временные credentials от turn-node, а медиа идёт через coturn.
  # Порты: 3478 (TURN/STUN UDP+TCP), 5349 (TLS), 49152-65535 (медиа relay UDP).
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "${COTURN_BIND:-0.0.0.0}:3478:3478/tcp"
      - "${COTURN_BIND:-0.0.0.0}:3478:3478/udp"
      - "${COTURN_BIND:-0.0.0.0}:49152-49200:49152-49200/udp"
    volumes:
      - ./config/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./data/coturn:/var/lib/coturn
    environment:
      # Передаём секрет через env — turnserver.conf читает его через ${TURN_SHARED_SECRET}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-dev-only-insecure-secret-change-me}
      TURN_REALM: ${TURN_REALM:-messenger.local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}  # установить в публичный IP при деплое
    command: >
      -c /etc/coturn/turnserver.conf
      --use-auth-secret
      --static-auth-secret=${TURN_SHARED_SECRET:-dev-only-insecure-secret-change-me}
      --realm=${TURN_REALM:-messenger.local}
      --min-port=49152
      --max-port=49200
      ${TURN_EXTERNAL_IP:+--external-ip=${TURN_EXTERNAL_IP}}

  # nginx-tls — TLS reverse proxy перед нодами (Деплой TLS, опциональный профиль).
  # Запуск: docker compose --profile tls up -d nginx-tls
  # Генерация сертификатов: bash scripts/generate-mtls-certs.sh
  # TLS-порты: 8101(home) 8102(storage) 8103(discovery) 8104(media) 8105(relay)
  nginx-tls:
    image: nginx:alpine
    profiles: [tls]
    restart: unless-stopped
    ports:
      - "8101:8101"  # home-node TLS
      - "8102:8102"  # storage-node TLS
      - "8103:8103"  # discovery-node TLS
      - "8104:8104"  # media-node TLS
      - "8105:8105"  # relay-node TLS
    volumes:
      - ./config/nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./config/mtls/gateway.crt:/etc/nginx/certs/gateway.crt:ro
      - ./config/mtls/gateway.key:/etc/nginx/certs/gateway.key:ro
      - ./config/mtls/ca.crt:/etc/nginx/certs/ca.crt:ro
    depends_on:
      - home-node
      - storage-node
      - discovery-node
      - media-node
      - relay-node

  gateway-node:
    build:
      context: .
      dockerfile: services/gateway-node/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8007}:8007"
      - "${GATEWAY_TLS_BIND:-0.0.0.0}:${GATEWAY_TLS_PORT:-8447}:${GATEWAY_TLS_PORT:-8447}"
    environment:
      GATEWAY_NODE_ID: ${GATEWAY_NODE_ID:-gateway-local}
      GATEWAY_NODE_PUBLIC_URL: ${GATEWAY_NODE_PUBLIC_URL:-http://localhost:8007}
      GATEWAY_DISCOVERY_PUBLIC_URL: ${GATEWAY_DISCOVERY_PUBLIC_URL:-http://localhost:8003}
      DISCOVERY_NODE_URL: ${DISCOVERY_NODE_URL:-http://discovery-node:8003}
      DEFAULT_HOME_NODE_URL: ${HOME_NODE_PUBLIC_URL:-http://localhost:8001}
      DEFAULT_MEDIA_NODE_URL: ${MEDIA_NODE_PUBLIC_URL:-http://localhost:8004}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      GATEWAY_INVITE_SECRET: ${GATEWAY_INVITE_SECRET:-}
      GATEWAY_INVITE_TTL_SECONDS: ${GATEWAY_INVITE_TTL_SECONDS:-300}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      NODE_ROOT_KEY_PATH: /data/node_root_key
      NODE_OPERATIONAL_CERTIFICATE_PATH: /data/node_operational_certificate.json
      NODE_OPERATIONAL_CREDENTIAL_CHAIN_PATH: /data/node_operational_credential_chain.json
      NODE_CAPABILITY_CERTIFICATE_PATH: ${NODE_CAPABILITY_CERTIFICATE_PATH:-}
      GATEWAY_TLS_ENABLED: ${GATEWAY_TLS_ENABLED:-false}
      GATEWAY_TLS_PORT: ${GATEWAY_TLS_PORT:-8447}
      GATEWAY_TLS_CERT_PATH: ${GATEWAY_TLS_CERT_PATH:-/mtls/gateway.crt}
      GATEWAY_TLS_KEY_PATH: ${GATEWAY_TLS_KEY_PATH:-/mtls/gateway.key}
      GATEWAY_TLS_CLIENT_CA_PATH: ${GATEWAY_TLS_CLIENT_CA_PATH:-/mtls/ca.crt}
      GATEWAY_MTLS_MODE: ${GATEWAY_MTLS_MODE:-off}
      ALLOWED_GATEWAY_CLIENT_FINGERPRINTS: ${ALLOWED_GATEWAY_CLIENT_FINGERPRINTS:-}
    volumes:
      - ./data/gateway:/data
      - ./config/mtls:/mtls:ro

  admin:
    build: ./admin-server
    restart: unless-stopped
    # Production: bind localhost only — use SSH tunnel (see docs/HANDOFF-AUTODEPLOY.md).
    # Dev override: ADMIN_BIND=0.0.0.0 in .env
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-9201}:${ADMIN_PORT:-9201}"
    environment:
      ADMIN_PORT: ${ADMIN_PORT:-9201}
      PROJECT_ROOT: /project
      ADMIN_STATIC: /project/admin
      ENV_FILE: /project/.env
      STORAGE_CONFIG: /project/config/storage.json
      COMPOSE_FILE: /project/docker-compose.yml
      MEDIA_NODE_URL: http://media-node:8004
      HOME_NODE_URL: http://project-home-node-1:8001
      STORAGE_NODE_URL: http://storage-node:8002
      RELAY_NODE_URL: http://relay-node:8005
      DISCOVERY_NODE_URL: http://discovery-node:8003
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET:-}
    volumes:
      - .:/project
      - /var/run/docker.sock:/var/run/docker.sock
