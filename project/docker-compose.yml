      MIX_PEER_CACHE_MAX_RECORDS: ${MIX_PEER_CACHE_MAX_RECORDS:-1000}
      CLUSTER_ID: ${CLUSTER_ID:-default}
      ENROLLMENT_MODE: ${ENROLLMENT_MODE:-legacy}
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_BUILD_HASH: ${NODE_BUILD_HASH:-dev-local}
      NODE_TLS_CERT_FINGERPRINT: ${NODE_TLS_CERT_FINGERPRINT:-}
      NODE_RELEASE_SIGNATURE: ${NODE_RELEASE_SIGNATURE:-}
      INTERNAL_SECURITY_MODE: ${INTERNAL_SECURITY_MODE:-legacy}
      FEDERATION_MAX_BODY_BYTES: ${FEDERATION_MAX_BODY_BYTES:-1048576}
      FEDERATION_NODE_ID_MODE: ${FEDERATION_NODE_ID_MODE:-report}
      FEDERATION_CAPABILITY_MODE: ${FEDERATION_CAPABILITY_MODE:-report}
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      NODE_ROOT_KEY_PATH: /data/node_root_key
