[package]
name = "ouo-sphinx-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
data-encoding = "=2.9.0"
nym-sphinx-types = { version = "=1.21.5", default-features = false, features = ["sphinx"] }
reed-solomon-erasure = { version = "=6.0.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
zeroize = "=1.8.1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
