# Minimal PPC relay stack for integration smoke (discovery + relay only).
# storage-app runs on the host for full E2E; this proves relay routing works.
services:
  discovery-node:
    build: ../../backend/services/discovery-node
    ports:
      - "8003:8003"
    environment:
      DISCOVERY_DB_PATH: /data/discovery.db
      ENROLLMENT_MODE: legacy
    volumes:
      - ./.data/discovery:/data

  relay-node:
    build:
      context: ../../backend
      dockerfile: services/relay-node/Dockerfile
    ports:
      - "8005:8005"
    depends_on:
      - discovery-node
    environment:
      RELAY_NODE_ID: relay-smoke
      RELAY_NODE_PUBLIC_URL: http://relay-node:8005
      DISCOVERY_NODE_URL: http://discovery-node:8003
      CLUSTER_ID: smoke
      ENROLLMENT_MODE: legacy
      INTERNAL_SECURITY_MODE: legacy
      NODE_TOKEN_PATH: /data/node_token
      ENROLLMENT_SECRET_PATH: /data/enrollment_secret
      NODE_SIGNING_KEY_PATH: /data/node_signing_key
      FEDERATION_NONCE_DB_PATH: /data/federation_nonces.db
      FEDERATION_AUDIT_DB_PATH: /data/federation_audit.db
    volumes:
      - ./.data/relay:/data
