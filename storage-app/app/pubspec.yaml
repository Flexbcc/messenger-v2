name: storage_app
description: Личное хранилище на ПК — альтернатива S3 для мессенджера.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# Desktop: windows / macos / linux. Server-ядро использует только dart:io,
# поэтому работает headless (без UI) на desktop VM.
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3          # sha256 контентной адресации
  cryptography: ^2.7.0    # Ed25519 подпись/проверка
  flutter_secure_storage: ^9.2.4  # OS keystore (meta.db key, Ed25519 seed)
  sqlite3: ^2.4.0         # meta.db (SQLite, метаданные)
  path: ^1.9.0
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  tray_manager: ^0.5.0
  window_manager: ^0.5.0
  bonsoir: ^5.1.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/tray.png
